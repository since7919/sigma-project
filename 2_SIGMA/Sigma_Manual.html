<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SIGMA Technical Manual Portal</title>
    <style>
        body {
            background: #0f172a;
            color: #e0e6ed;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .portal {
            text-align: center;
            padding: 40px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { color: #00d4ff; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #00d4ff;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="portal">
        <h1>📊 SIGMA Manual Portal</h1>
        <p>매뉴얼이 효율적인 관리를 위해 챕터별로 모듈화되었습니다.</p>
        <a href="Manual_Chapters/index.html" class="btn">모듈형 매뉴얼 시작하기</a>
    </div>
</body>
</html>
