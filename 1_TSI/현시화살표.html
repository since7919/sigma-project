<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>8방향 마스터 현시 가이드 (8x8x8 완결판)</title>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Pretendard', sans-serif; padding: 20px 40px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; font-weight: 800; letter-spacing: -1px; }
        
        .section-title { font-size: 18px; font-weight: 700; color: #00FF66; margin: 35px 0 15px; padding-left: 12px; border-left: 4px solid #00FF66; }
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        
        .phase-card {
            background: #1e293b; border: 2px solid #334155; border-radius: 14px;
            padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease; opacity: 0.3; filter: grayscale(1);
        }
        
        .phase-card.active { 
            opacity: 1; filter: grayscale(0); border-color: #00FF66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15); transform: translateY(-3px);
        }

        .phase-no { font-size: 9px; color: #38bdf8; font-weight: 800; text-transform: uppercase; margin-bottom: 3px; }
        .phase-name { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: #fff; }

        .phase-lens {
            width: 90px; height: 90px;
            background: #000; border-radius: 18px; border: 3px solid #475569;
            margin: 0 auto; display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
        }
        .phase-card.active .phase-lens { border-color: #00FF66; }

        .arrow { fill: #334155; transition: fill 0.3s; }
        .phase-card.active .arrow { fill: #00FF66; filter: drop-shadow(0 0 6px rgba(0, 255, 102, 0.6)); }
        
        .description { font-size: 10px; color: #94a3b8; margin-top: 10px; line-height: 1.3; height: 26px; overflow: hidden; }

        .timer-bar-container {
            width: 100%; height: 4px; background: #0f172a; margin-top: 15px; border-radius: 2px; overflow: hidden;
        }
        .timer-bar {
            width: 0%; height: 100%; background: #00FF66; transition: width 0.1s linear;
        }
        .countdown-text {
            font-size: 16px; font-weight: 900; color: #00FF66; margin-top: 5px; font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚦 8방향 마스터 현시 가이드 (8x8x8 완결판)</h1>

    <div class="section-title">1. 개별 방향 직좌 통합 (8 Directions)</div>
    <div class="dashboard" id="combined-group"></div>

    <div class="section-title">2. 방향별 양방향 직진 (8 Directions Dual-Straight)</div>
    <div class="dashboard" id="dual-straight-group"></div>

    <div class="section-title">3. 방향별 양방향 좌회전 (8 Directions Dual-Left)</div>
    <div class="dashboard" id="dual-left-group"></div>
</div>

<script>
    const PATHS = {
        STRAIGHT: "M48 85 V30 H36 L50 8 L64 30 H52 V85 Z",
        LEFT_BENT: "M52 82 V45 H30 L30 35 L12 50 L30 65 L30 55 H45 V82 Z"
    };

    // 공통 8방향 정의 (진입로 기준)
    const baseDirs = [
        { id: 1, name: '북측', rot: 180, deg: 0 },
        { id: 2, name: '북동측', rot: 135, deg: 45 },
        { id: 3, name: '동측', rot: 90, deg: 90 },
        { id: 4, name: '남동측', rot: 45, deg: 135 },
        { id: 5, name: '남측', rot: 0, deg: 180 },
        { id: 6, name: '남서측', rot: 315, deg: 225 },
        { id: 7, name: '서측', rot: 270, deg: 270 },
        { id: 8, name: '북서측', rot: 225, deg: 315 }
    ];

    function renderGroup(groupId, type) {
        const container = document.getElementById(groupId);
        container.innerHTML = baseDirs.map(d => {
            const phaseId = `${type.toLowerCase()}-${d.id}`;
            return `
                <div class="phase-card" id="card-${phaseId}">
                    <div class="phase-no">${type}</div>
                    <div class="phase-name">${d.name} ${type==='COMBINED'?'직좌':type==='STRAIGHT'?'양직진':'양좌회전'}</div>
                    <div class="phase-lens">
                        <svg viewBox="0 0 100 100" width="75" height="75">
                            <g transform="rotate(${d.rot}, 50, 50)">
                                ${type === 'COMBINED' ? `
                                    <g class="arrow" transform="translate(-16, 0)">
                                        <path d="${PATHS.LEFT_BENT}" />
                                    </g>
                                    <g class="arrow" transform="translate(16, 0)">
                                        <path d="${PATHS.STRAIGHT}" />
                                    </g>
                                ` : type === 'STRAIGHT' ? `
                                    <g class="arrow" transform="translate(-18, 0)">
                                        <path d="${PATHS.STRAIGHT}" />
                                    </g>
                                    <g class="arrow" transform="translate(18, 0) rotate(180, 50, 50)">
                                        <path d="${PATHS.STRAIGHT}" />
                                    </g>
                                ` : `
                                    <g class="arrow" transform="translate(-16, 0)">
                                        <path d="${PATHS.LEFT_BENT}" />
                                    </g>
                                    <g class="arrow" transform="translate(16, 0) rotate(180, 50, 50)">
                                        <path d="${PATHS.LEFT_BENT}" />
                                    </g>
                                `}
                            </g>
                        </svg>
                    </div>
                    <div class="description">${d.deg}° 진입 시 기준 도식</div>
                    <div class="timer-bar-container"><div class="timer-bar" id="bar-${phaseId}"></div></div>
                    <div class="countdown-text" id="count-${phaseId}"></div>
                </div>
            `;
        }).join('');
    }

    renderGroup('combined-group', 'COMBINED');
    renderGroup('dual-straight-group', 'STRAIGHT');
    renderGroup('dual-left-group', 'LEFT');

    // 시뮬레이션 통합
    const allGroups = ['COMBINED', 'STRAIGHT', 'LEFT'];
    let currentTypeIdx = 0;
    let currentDirIdx = 0;
    const phaseTime = 1500;
    let progress = 0;

    function updateSim() {
        document.querySelectorAll('.phase-card').forEach(card => card.classList.remove('active'));
        document.querySelectorAll('.timer-bar').forEach(bar => bar.style.width = '0%');
        document.querySelectorAll('.countdown-text').forEach(t => t.textContent = '');

        const type = allGroups[currentTypeIdx];
        const dirId = baseDirs[currentDirIdx].id;
        const activeCard = document.getElementById(`card-${type.toLowerCase()}-${dirId}`);
        if (activeCard) activeCard.classList.add('active');
        progress = 0;
    }

    setInterval(() => {
        progress += (100 / (phaseTime / 100));
        const type = allGroups[currentTypeIdx];
        const dirId = baseDirs[currentDirIdx].id;
        const activeBar = document.getElementById(`bar-${type.toLowerCase()}-${dirId}`);
        const activeCount = document.getElementById(`count-${type.toLowerCase()}-${dirId}`);
        
        if (activeBar) activeBar.style.width = `${progress}%`;
        if (activeCount) {
            const timeLeft = Math.ceil((phaseTime - (progress * phaseTime / 100)) / 1000);
            activeCount.textContent = timeLeft + 's';
        }

        if (progress >= 100) {
            currentDirIdx = (currentDirIdx + 1) % baseDirs.length;
            if (currentDirIdx === 0) {
                currentTypeIdx = (currentTypeIdx + 1) % allGroups.length;
            }
            updateSim();
        }
    }, 100);

    updateSim();
</script>

</body>
</html>
