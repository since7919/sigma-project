<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA Data Viewer</title>
    
    <!-- Tabulator CSS (Midnight Theme for Dark Mode) -->
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;700;800&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #060913; color: #fff;
            font-family: 'Pretendard', 'Outfit', sans-serif;
            display: flex; flex-direction: column;
        }

        .header {
            padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            margin: 0; font-family: 'Orbitron'; font-size: 24px; color: #00d4ff;
        }

        .controls {
            display: flex; gap: 15px; align-items: center;
        }

        select, button {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: 'Pretendard';
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover, select:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .nav-button {
            color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05);
        }

        .tabs {
            display: flex; background: rgba(0,0,0,0.5); padding: 0 20px; border-bottom: 1px solid #333;
        }

        .tab {
            padding: 12px 24px; cursor: pointer; color: #aaa; border-bottom: 2px solid transparent;
            font-weight: 600; transition: all 0.3s;
        }

        .tab:hover { color: #fff; }
        .tab.active { color: #00d4ff; border-bottom: 2px solid #00d4ff; }

        .content {
            flex: 1; padding: 20px; overflow: hidden; display: flex; flex-direction: column;
        }

        #data-table {
            flex: 1; border-radius: 6px; border: 1px solid #333;
            /* Tabulator 폰트 조정 */
            font-size: 13px;
        }
        
        .tabulator-row {
            min-height: 30px !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SIGMA DATA VIEWER</h1>
        <div class="controls">
            <select id="region-select">
                <option value="L01">서울 (L01)</option>
                <option value="L02">인천 (L02)</option>
                <option value="">전체 (All)</option>
            </select>
            <button id="btn-refresh">새로고침 (Refresh)</button>
            <button id="btn-add-rows" style="border-color: #00ffaa; color: #00ffaa;">+ 새 행 10개 추가</button>
            <button id="btn-save-db" style="background: rgba(255, 0, 255, 0.1); border-color: #ff00ff; color: #ff00ff;">💾 DB에 일괄 저장</button>
            <button id="btn-download">CSV 다운로드</button>
            <button class="nav-button" onclick="location.href='../index.html'">← 포털 메인</button>
            <button class="nav-button" onclick="location.href='dashboard.html'">대시보드</button>
        </div>
    </div>

    <div class="tabs" id="table-tabs">
        <div class="tab active" data-table="junctions">교차로 마스터</div>
        <div class="tab" data-table="signal_maps">현시계획</div>
        <div class="tab" data-table="tod_plans">TOD 운영계획</div>
        <div class="tab" data-table="groups">그룹 정보</div>
    </div>

    <div class="content">
        <div id="data-table"></div>
    </div>

    <!-- Tabulator JS -->
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <script src="js/data_viewer.js"></script>
</body>
</html>
