<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA Data Viewer</title>
    
    <!-- Tabulator CSS (Midnight Theme for Dark Mode) -->
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;700;800&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #060913; color: #fff;
            font-family: 'Pretendard', 'Outfit', sans-serif;
            display: flex; flex-direction: column;
        }

        .header {
            padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            margin: 0; font-family: 'Orbitron'; font-size: 24px; color: #00d4ff;
        }

        .controls {
            display: flex; gap: 15px; align-items: center;
        }

        select, button {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: 'Pretendard';
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover, select:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .nav-button {
            color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05);
        }

        .tabs {
            display: flex; background: rgba(0,0,0,0.5); padding: 0 20px; border-bottom: 1px solid #333;
        }

        .tab {
            padding: 12px 24px; cursor: pointer; color: #aaa; border-bottom: 2px solid transparent;
            font-weight: 600; transition: all 0.3s;
        }

        .tab:hover { color: #fff; }
        .tab.active { color: #00d4ff; border-bottom: 2px solid #00d4ff; }

        .content {
            flex: 1; padding: 20px; overflow: hidden; display: flex; flex-direction: column;
        }

        #data-table {
            flex: 1; border-radius: 6px; border: 1px solid #333;
            /* Tabulator 폰트 조정 */
            font-size: 13px;
        }
        
        .tabulator-row {
            min-height: 30px !important;
        }

        /* ─── 관리자 비밀번호 확인 모달 스타일 ─── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #0d1326;
            border: 1px solid rgba(255, 0, 255, 0.4);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.25), 0 20px 40px rgba(0,0,0,0.8);
            border-radius: 12px;
            width: 440px;
            max-width: 90vw;
            padding: 28px 24px 24px;
            box-sizing: border-box;
            animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px;
        }
        .modal-header h2 {
            margin: 0; font-size: 18px; font-weight: 700; color: #ff00ff;
            font-family: 'Pretendard', sans-serif;
            display: flex; align-items: center; gap: 8px;
        }
        .modal-body {
            font-size: 14px; color: #cbd5e1; line-height: 1.5;
        }
        .meta-badges {
            display: flex; gap: 8px; margin: 12px 0 16px; flex-wrap: wrap;
        }
        .meta-badge {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .meta-badge.danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .input-group {
            position: relative; margin-top: 16px;
        }
        .input-group input {
            width: 100%; box-sizing: border-box;
            background: #060913;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 42px 12px 14px;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            letter-spacing: 2px;
        }
        .input-group input:focus {
            border-color: #ff00ff;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
        }
        .input-group input.error {
            border-color: #ef4444 !important;
            animation: shake 0.35s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .btn-toggle-pw {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px 6px;
            font-size: 16px;
        }
        .btn-toggle-pw:hover { color: #fff; background: none; }
        .modal-msg {
            min-height: 20px; margin-top: 8px; font-size: 12px; color: #ef4444; font-weight: 500;
        }
        .progress-box {
            display: none; margin-top: 14px;
        }
        .progress-box.active { display: block; }
        .progress-bar-bg {
            background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #00d4ff, #ff00ff);
            height: 100%; width: 0%; transition: width 0.2s;
        }
        .progress-text {
            font-size: 12px; color: #94a3b8; margin-top: 6px; text-align: center;
        }
        .modal-footer {
            margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;
        }
        .modal-footer button {
            padding: 9px 18px; font-weight: 600; font-size: 13px;
        }
        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            color: #aaa;
        }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn-confirm {
            background: rgba(255, 0, 255, 0.2);
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }
        .btn-confirm:hover {
            background: rgba(255, 0, 255, 0.35);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }
        .btn-confirm:disabled, .btn-cancel:disabled {
            opacity: 0.5; cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SIGMA DATA VIEWER</h1>
        <div class="controls">
            <select id="region-select">
                <option value="L01">서울 (L01)</option>
                <option value="L02">인천 (L02)</option>
                <option value="">전체 (All)</option>
            </select>
            <button id="btn-refresh">새로고침 (Refresh)</button>
            <button id="btn-add-rows" style="border-color: #00ffaa; color: #00ffaa;">+ 새 행 10개 추가</button>
            <button id="btn-save-db" style="background: rgba(255, 0, 255, 0.1); border-color: #ff00ff; color: #ff00ff;">💾 DB에 일괄 저장</button>
            <button id="btn-download">CSV 다운로드</button>
            <button class="nav-button" onclick="handleBackToSim()" title="시뮬레이터 창으로 복귀하거나 창을 닫습니다">← 시뮬레이터 복귀</button>
            <button class="nav-button" onclick="location.href='/'" title="통합 포털 메인으로 이동합니다">🌐 포털 메인</button>
            <button class="nav-button" onclick="location.href='dashboard.html'">대시보드</button>
        </div>
    </div>

    <div class="tabs" id="table-tabs">
        <div class="tab active" data-table="junctions">교차로 마스터</div>
        <div class="tab" data-table="signal_maps">현시계획</div>
        <div class="tab" data-table="tod_plans">TOD 운영계획</div>
        <div class="tab" data-table="groups">그룹 정보</div>
    </div>

    <div class="content">
        <div id="data-table"></div>
    </div>

    <!-- ─── 관리자 비밀번호 확인 및 DB 저장 모달 ─── -->
    <div class="modal-overlay" id="password-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>🔒 관리자 DB 쓰기 인증</h2>
            </div>
            <div class="modal-body">
                <div>데이터베이스(Supabase)에 직접 수정 사항을 영구 반영합니다.</div>
                <div class="meta-badges">
                    <span class="meta-badge" id="modal-table-badge">테이블: junctions</span>
                    <span class="meta-badge" id="modal-region-badge">지역: 서울 (L01)</span>
                    <span class="meta-badge danger" id="modal-count-badge">반영 건수: 0건</span>
                </div>
                <div style="font-size: 12px; color: #f87171;">
                    ⚠️ 기존 데이터가 덮어쓰기 되며 이전 상태로 되돌릴 수 없습니다.
                </div>
                <div class="input-group">
                    <input type="password" id="modal-password-input" placeholder="관리자 인증 비밀번호" autocomplete="current-password">
                    <button type="button" class="btn-toggle-pw" id="btn-toggle-pw" title="비밀번호 표시/숨김">👁️</button>
                </div>
                <div class="modal-msg" id="modal-msg"></div>
                <div class="progress-box" id="modal-progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="modal-progress-fill"></div>
                    </div>
                    <div class="progress-text" id="modal-progress-text">저장 진행 중... 0%</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="btn-modal-cancel">취소 (Esc)</button>
                <button type="button" class="btn-confirm" id="btn-modal-confirm">인증 및 DB 저장</button>
            </div>
        </div>
    </div>

    <script>
        function handleBackToSim() {
            if (window.opener && !window.opener.closed) {
                window.opener.focus();
                window.close();
            } else {
                location.href = 'index.html';
            }
        }
    </script>
    <!-- Tabulator JS -->
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <script src="js/data_viewer.js?v=1795350000000"></script>
</body>
</html>
