<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시공도 비교 — SIGMA TSD Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#e8e8e8; font-family:'Outfit','Inter',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

#header {
  display:flex; align-items:center; justify-content:space-between; padding:6px 16px;
  background:#1a1f2e; border-bottom:2px solid #333; flex-shrink:0; gap:12px;
}
#header .title { font-size:13px; font-weight:800; color:#33ccff; letter-spacing:0.04em; }
#header .controls { display:flex; align-items:center; gap:10px; flex-shrink:0; }
#header label { font-size:11px; color:#aaa; }
#header input[type=number] {
  width:46px; background:#111; border:1px solid #444; color:#33ccff; font-weight:800;
  font-size:11px; text-align:center; border-radius:3px; padding:3px 0;
}
.radio-group { display:flex; background:#111; border:1px solid #333; border-radius:3px; overflow:hidden; }
.radio-group label { padding:3px 10px; cursor:pointer; font-size:10px; color:#aaa; }
.radio-group input { display:none; }
.radio-group input:checked + span { color:#33ccff; font-weight:700; }
.btn { padding:4px 12px; border-radius:3px; font-size:10px; font-weight:800; cursor:pointer; border:none; transition:0.15s; }
.btn-reset { background:#2a1a10; color:#ff8a65; border:1px solid #553; }
.btn-apply { background:#0a2a0a; color:#4caf50; border:1px solid #2a4; }

/* 메인 콘텐츠: 좌우 분할 */
#main { display:flex; flex:1; overflow:hidden; }

.panel {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
  border-right:2px solid #bbb; position:relative;
}
.panel:last-child { border-right:none; }
.panel-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:5px 14px; flex-shrink:0; font-size:11px; font-weight:700;
}
.panel-left .panel-header { background:#e0f0e0; color:#1a6b1a; border-bottom:2px solid #aad4aa; }
.panel-right .panel-header { background:#e0e8f8; color:#1a3a7b; border-bottom:2px solid #aac0e8; }
.panel-info { font-size:10px; font-weight:600; color:#555; }
.canvas-wrap { flex:1; position:relative; overflow:hidden; }
canvas { width:100%; height:100%; display:block; }

#footer {
  display:flex; align-items:center; gap:18px; padding:5px 16px;
  background:#1a1f2e; border-top:1px solid #333; font-size:10px; color:#777; flex-shrink:0;
}
.ldot { display:inline-block; width:14px; height:4px; vertical-align:middle; margin-right:3px; border-radius:1px; }
</style>
</head>
<body>

<div id="header">
  <span class="title">📊 SIGMA — 시공도 비교 분석</span>
  <div class="controls">
    <span style="font-size:10px;color:#666;font-weight:700;">연동축</span>
    <div class="radio-group">
      <label><input type="radio" name="axis" value="ew" checked onchange="refresh()"><span>E-W</span></label>
      <label><input type="radio" name="axis" value="ns" onchange="refresh()"><span>S-N</span></label>
    </div>
    <label>속도
      <input type="number" id="speed" value="50" step="5" onchange="refresh()">
      <span style="font-size:9px;color:#555;">km/h</span>
    </label>
    <button class="btn btn-reset" onclick="resetRight()">↺ 우측 초기화</button>
    <button class="btn btn-apply" onclick="applyRight()">✓ 우측 적용</button>
  </div>
</div>

<div id="main">
  <!-- 좌: 현재(원본) -->
  <div class="panel panel-left">
    <div class="panel-header">
      <span>📌 현재 오프셋 (원본)</span>
      <span class="panel-info" id="info-left">—</span>
    </div>
    <div class="canvas-wrap" id="wrap-left"><canvas id="cv-left"></canvas></div>
  </div>
  <!-- 우: 최적화(편집) -->
  <div class="panel panel-right">
    <div class="panel-header">
      <span>🔧 최적화 (드래그로 오프셋 조절)</span>
      <span class="panel-info" id="info-right">—</span>
    </div>
    <div class="canvas-wrap" id="wrap-right"><canvas id="cv-right"></canvas></div>
  </div>
</div>

<div id="footer">
  <span><span class="ldot" style="background:rgba(0,100,220,0.4);border:1px solid #0050c8;"></span>UP↑</span>
  <span><span class="ldot" style="background:rgba(0,160,220,0.4);border:1px solid #00a0dc;"></span>DOWN↓</span>
  <span>● 우측 캔버스에서 드래그로 오프셋 조절 → 좌측과 비교</span>
  <span style="margin-left:auto;">* [✓ 우측 적용] : 최적화 오프셋을 대시보드에 반영</span>
</div>

<script>
// ── 상태 ──
let _parentState = null;
let _frozenOffsets = {};   // 원본 오프셋 스냅샷 (좌측용)
let _editOffsets   = {};   // 편집 오프셋 딥카피 (우측용)
let LEFT = null, RIGHT = null;

// [보안 우회] 부모 창과 file:// 프로토콜 보안 문제 해결을 위해 localStorage 이용
function initFromTransfer(data) {
    if (!data) return;
    _parentState = { currentGroupDayTypeIdx: data.dayIdx, junctions: {} };
    if (data.members) data.members.forEach(m => { _parentState.junctions[m.id] = m; });
    _frozenOffsets = JSON.parse(JSON.stringify(data.offsets));
    _editOffsets = JSON.parse(JSON.stringify(data.offsets));
    if (!LEFT) {
        LEFT = new PopupTSD('cv-left', 'wrap-left', 'info-left', false);
        RIGHT = new PopupTSD('cv-right', 'wrap-right', 'info-right', true);
    }
    syncStateFromData(LEFT, data); syncStateFromData(RIGHT, data);
    refresh();
}
function syncStateFromData(eng, data) {
    if(!eng || !data) return;
    eng.state.gid = data.gid; eng.state.members = data.members; eng.state.distances = data.distances;
    eng.state.totalDist = data.totalDist; eng.state.cycle = data.cycle; eng.state.todIdx = data.todIdx;
    eng.state.travelTimes = data.travelTimes;
}
window.addEventListener('load', () => {
    const raw = localStorage.getItem('SIGMA_TSD_TRANSFER');
    if (raw) try { initFromTransfer(JSON.parse(raw)); } catch (e) { console.error(e); }
});
window.addEventListener('storage', (e) => {
    if (e.key === 'SIGMA_TSD_TRANSFER' && e.newValue) {
        try { initFromTransfer(JSON.parse(e.newValue)); } catch (e) { console.error(e); }
    }
});

function getAxis() { const e = document.querySelector('input[name="axis"]:checked'); return e ? e.value : 'ew'; }
function getSpeed() { return parseFloat(document.getElementById('speed').value) || 50; }

function refresh() {
  const raw = localStorage.getItem('SIGMA_TSD_TRANSFER');
  if (raw) {
    try {
      const data = JSON.parse(raw);
      if (LEFT) { syncStateFromData(LEFT, data);  LEFT.render();  }
      if (RIGHT) { syncStateFromData(RIGHT, data); RIGHT.render(); }
    } catch(e) {}
  }
}

function resetRight() {
  // 우측 편집 오프셋을 원본(좌측)으로 복원
  _editOffsets = JSON.parse(JSON.stringify(_frozenOffsets));
  if (RIGHT) RIGHT.render();
}

function applyRight() {
  // 우측 편집 오프셋을 대시보드 STATE에 적용
  if (!_parentState) return;
  const dayIdx = _parentState.currentGroupDayTypeIdx || 0;
  
  const applyData = {
      offsets: _editOffsets,
      dayIdx: dayIdx,
      timestamp: Date.now()
  };
  // [보안 우회] window.opener 직접 호출 대신 localStorage 신호 전달
  localStorage.setItem('SIGMA_TSD_APPLY', JSON.stringify(applyData));
  alert('최적화 오프셋이 대시보드 반영 대기열에 추가되었습니다.');
}

window.addEventListener('focus', () => { if (LEFT && RIGHT) refresh(); });

// ── 공통 알고리즘 ──
class Analyzer {
  static getGreenWindow(j, axis, dir, dayIdx, pIdx, cycle, offsetOverride) {
    const smIdx = (j.dayPlanMapIds && j.dayPlanMapIds[dayIdx]) ? j.dayPlanMapIds[dayIdx] : 0;
    const sm = (j.signalMaps && j.signalMaps[smIdx]) ? j.signalMaps[smIdx] : null;
    if (!sm) return null;
    const tod = (j.dayPlans && j.dayPlans[dayIdx]) ? j.dayPlans[dayIdx][pIdx] : null;
    if (!tod) return null;
    const offset = (offsetOverride !== undefined) ? offsetOverride : (tod.offset || 0);
    const targetMov = (dir==='up') ? (axis==='ew'?2:4) : (axis==='ew'?6:8);
    let ringIdx=-1, phaseIdx=-1;
    const iA = (sm.movA||[]).indexOf(targetMov);
    if (iA!==-1) { ringIdx=0; phaseIdx=iA; }
    else { const iB=(sm.movB||[]).indexOf(targetMov); if(iB!==-1){ringIdx=1;phaseIdx=iB;} }
    
    if (phaseIdx===-1) return null;
    const splits=(ringIdx===0)?(tod.splitA||[]):(tod.splitB||[]);
    const yellows=(ringIdx===0)?(sm.yellowA||[]):(sm.yellowB||[]);
    let accT=0; for(let s=0;s<phaseIdx;s++) accT+=(splits[s]||0);
    const gLen=Math.max(0,(splits[phaseIdx]||0)-(yellows[phaseIdx]||0));
    if(gLen<=0) return null;
    return { gStart:((offset+accT)%cycle+cycle)%cycle, gLen };
  }
  static calcBand(dir,axis,members,distances,totalDist,cycle,travelTimes,dayIdx,pIdx,offsets) {
    if(!members||members.length<2||cycle<=0) return {width:0,start:0,vc:0};
    const totalTT = travelTimes[travelTimes.length - 1] || 1;
    const vn=[];
    for(let i=0;i<members.length;i++){
      const off = offsets[members[i].id] ? offsets[members[i].id][pIdx] : undefined;
      const g=this.getGreenWindow(members[i],axis,dir,dayIdx,pIdx,cycle,off);
      if(g) vn.push({idx:i,tt:travelTimes[i],green:g});
    }
    if(vn.length<2) return {width:0,start:0,vc:vn.length};
    let bW=0,bS=0;
    for(let t=0;t<cycle;t+=0.25){
      let minR=cycle,ok=true;
      for(const n of vn){
        const tr=(dir==='up')?(n.tt):((totalTT-n.tt));
        const arr=((t+tr)%cycle+cycle)%cycle;
        const gS=n.green.gStart, gE=(gS+n.green.gLen)%cycle;
        const isG=(gS<gE)?(arr>=gS&&arr<gE):(arr>=gS||arr<gE);
        if(!isG){ok=false;break;}
        const rem=(gS<gE)?(gE-arr):(arr>=gS?cycle-arr+gE:gE-arr);
        minR=Math.min(minR,rem);
      }
      if(ok&&minR>bW){bW=minR;bS=t;}
    }
    return {width:bW,start:bS,vc:vn.length};
  }
}

// ── PopupTSD 엔진 ──
class PopupTSD {
  constructor(canvasId, wrapId, infoId, editable) {
    this.canvas = document.getElementById(canvasId);
    this.ctx    = this.canvas.getContext('2d');
    this.wrapId = wrapId;
    this.infoId = infoId;
    this.editable = editable;
    this.cfg = {
      pad: {top:70,bottom:40,left:140,right:40},
      green:'#22cc44', red:'rgba(220,30,30,0.85)', yellow:'#ddaa00',
      blue:'rgba(60,130,200,0.70)', blueFill:'rgba(0,100,220,0.15)',
      bandUpS:'rgba(0,80,200,0.90)', bandDnS:'rgba(0,160,220,0.90)',
      trajUp:'rgba(0,80,200,0.85)', trajDn:'rgba(0,160,220,0.85)',
      blocked:'rgba(220,30,30,0.85)', wait:'#dd2222',
    };
    this.state = { gid:null,members:[],distances:[],totalDist:0,cycle:100,todIdx:0,
      viewOffsetT:0, isDragging:false, isDraggingOffset:false, dragJid:null, lastX:0, yCoords:[] };
    this._initEvents();
    window.addEventListener('resize', () => this.render());
  }

  _getOffsets() { return this.editable ? _editOffsets : _frozenOffsets; }
  _getOffset(jid, pIdx) {
    const o = this._getOffsets();
    return (o[jid] && o[jid][pIdx] !== undefined) ? o[jid][pIdx] : 0;
  }

  _initEvents() {
    const getHit = (e) => {
      const r=this.canvas.getBoundingClientRect();
      const mx=e.clientX-r.left, my=(e.clientY-r.top)/(window.devicePixelRatio||1);
      if(mx<this.cfg.pad.left) return null;
      for(const it of this.state.yCoords) if(Math.abs(my-it.y)<20) return it.id;
      return null;
    };
    this.canvas.addEventListener('mousemove', e => {
      if(this.state.isDragging||this.state.isDraggingOffset) return;
      this.canvas.style.cursor = (this.editable && getHit(e)) ? 'ew-resize' : 'grab';
    });
    this.canvas.addEventListener('mousedown', e => {
      if(e.button!==0) return;
      const hit = getHit(e);
      this.state.lastX = e.clientX;
      if(this.editable && hit) { this.state.isDraggingOffset=true; this.state.dragJid=hit; this.canvas.style.cursor='ew-resize'; }
      else { this.state.isDragging=true; this.canvas.style.cursor='grabbing'; }
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if(!this.state.isDragging && !this.state.isDraggingOffset) return;
      const dx=e.clientX-this.state.lastX;
      const cW=this.canvas.clientWidth-this.cfg.pad.left-this.cfg.pad.right;
      const dt=(dx/cW)*(this.state.cycle*2.5);
      if(this.state.isDraggingOffset && this.editable) {
        const pIdx=this.state.todIdx, cycle=this.state.cycle;
        if(_editOffsets[this.state.dragJid]) {
          let v = (_editOffsets[this.state.dragJid][pIdx]||0)+dt;
          v = ((v%cycle)+cycle)%cycle;
          _editOffsets[this.state.dragJid][pIdx] = Math.round(v*10)/10;
        }
      } else { this.state.viewOffsetT -= dt; }
      this.state.lastX = e.clientX;
      this.render();
    });
    window.addEventListener('mouseup', () => {
      this.state.isDragging=false; this.state.isDraggingOffset=false;
      this.state.dragJid=null; this.canvas.style.cursor='grab';
    });
    this.canvas.addEventListener('wheel', e => {
      e.preventDefault(); this.state.viewOffsetT+=e.deltaY*0.12; this.render();
    });
  }

  _updateTravelTimes() {
    const dists = this.state.distances;
    if (!dists || dists.length < 2) return;
    const speedInput = document.getElementById('speed');
    const speed = (speedInput ? parseFloat(speedInput.value) : 50) / 3.6; // m/s
    const tt = [0];
    let acc = 0;
    for (let i = 1; i < dists.length; i++) {
        const d = dists[i] - dists[i - 1];
        acc += d / speed;
        tt.push(acc);
    }
    this.state.travelTimes = tt;
  }

  render() {
    if(!this.canvas||this.state.members.length<2) return;
    this._updateTravelTimes();
    const wrap=document.getElementById(this.wrapId);
    const dpr=window.devicePixelRatio||1;
    this.canvas.width=wrap.clientWidth*dpr; this.canvas.height=wrap.clientHeight*dpr;
    this.ctx.scale(dpr,dpr);
    const w=wrap.clientWidth, h=wrap.clientHeight;
    const ctx=this.ctx, P=this.cfg.pad;
    ctx.fillStyle='#f4f4f4'; ctx.fillRect(0,0,w,h);

    const cW=w-P.left-P.right, cH=h-P.top-P.bottom;
    const cycle = this.state.cycle, tH = cycle * 2.5;
    const dayIdx = _parentState ? ((_parentState.currentGroupDayTypeIdx) || 0) : 0;
    const axis = getAxis();
    const offsets = this._getOffsets();
    const pIdx = this.state.todIdx;

    const travelTimes = this.state.travelTimes || new Array(this.state.members.length).fill(0);
    const bUp = Analyzer.calcBand('up', axis, this.state.members, this.state.distances, this.state.totalDist, cycle, travelTimes, dayIdx, pIdx, offsets);
    const bDown = Analyzer.calcBand('down', axis, this.state.members, this.state.distances, this.state.totalDist, cycle, travelTimes, dayIdx, pIdx, offsets);

    const xF = cW / tH;
    const tToX = t => P.left + (t - this.state.viewOffsetT) * xF;
    const rm = 20;
    const distToY = d => P.top + rm + (1 - d / (this.state.totalDist || 1)) * (cH - rm * 2);

    ctx.save(); ctx.beginPath(); ctx.rect(P.left, P.top, cW, cH); ctx.clip();

    // Grid
    ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1;
    for (let t = -cycle; t < tH + cycle; t += 20) { const x = tToX(t); ctx.beginPath(); ctx.moveTo(x, P.top); ctx.lineTo(x, h - P.bottom); ctx.stroke(); }

    // Signal bars
    this.state.yCoords = [];
    this.state.members.forEach((j, i) => {
      const y = distToY(this.state.distances[i]);
      this.state.yCoords.push({ id: j.id, y });
      ctx.strokeStyle = 'rgba(0,0,0,0.04)'; ctx.beginPath(); ctx.moveTo(P.left, y); ctx.lineTo(w - P.right, y); ctx.stroke();
      this._drawRings(j, y, cW, xF, dayIdx, axis, cycle);
    });

    // Bands
    this._drawBand('up', bUp, tH, xF, tToX, distToY, dayIdx, axis, cycle);
    this._drawBand('down', bDown, tH, xF, tToX, distToY, dayIdx, axis, cycle);
    ctx.restore();

    // Labels
    this.state.members.forEach((j,i)=>{
      const y=distToY(this.state.distances[i]);
      const off=this._getOffset(j.id,pIdx);
      ctx.fillStyle='rgba(244,244,244,0.95)';ctx.fillRect(0,y-26,P.left-2,52);
      ctx.textAlign='right';
      ctx.fillStyle='#222';ctx.font='bold 11px "Outfit",sans-serif';
      let nm=j.name||j.id; if(nm.length>9)nm=nm.substring(0,8)+'..';
      ctx.fillText(nm,P.left-8,y-6);
      ctx.fillStyle='#2e7d32';ctx.font='bold 9px "JetBrains Mono",monospace';
      ctx.fillText(`▸${Math.round(this.state.distances[i])}m`,P.left-8,y+7);
      ctx.fillStyle=off!==0?'#c75000':'#888';ctx.font='bold 9px "JetBrains Mono",monospace';
      ctx.fillText(`⊕${Math.round(off)}s`,P.left-8,y+19);
    });

    // Time axis
    ctx.fillStyle='#666';ctx.font='9px "JetBrains Mono",monospace';ctx.textAlign='center';
    for(let t=0;t<tH;t+=20){const x=tToX(t);if(x>P.left&&x<w-P.right)ctx.fillText(`${Math.round(t)}s`,x,h-P.bottom+14);}

    this._updateInfo(bUp,bDown,cycle);
  }

  _drawRings(j,y,cW,xF,dayIdx,axis,cycle) {
    const pIdx=this.state.todIdx;
    const tod=(j.dayPlans&&j.dayPlans[dayIdx])?j.dayPlans[dayIdx][pIdx]:null;
    if(!tod) return;
    const smIdx=(j.dayPlanMapIds&&j.dayPlanMapIds[dayIdx])?j.dayPlanMapIds[dayIdx]:0;
    const sm=(j.signalMaps&&j.signalMaps[smIdx])?j.signalMaps[smIdx]:null;
    if(!sm) return;
    const offset=this._getOffset(j.id,pIdx);
    const rH=12,gap=3,P=this.cfg.pad,ctx=this.ctx;
    const proceed=(axis==='ew')?[2,6]:[4,8], blocked=(axis==='ew')?[4,8]:[2,6];

    ctx.fillStyle='rgba(240,240,240,0.6)';ctx.fillRect(P.left,y-rH-gap-1,cW,(rH+gap)*2+2);

    const ring=(sp,yl,mv,bot)=>{
      if(!sp||!sp.length) return;
      const yP=bot?(y+gap):(y-gap-rH); let cur=0;
      sp.forEach((st,idx)=>{
        if(st<=0){cur+=st;return;}
        const yt=(yl&&yl[idx])?yl[idx]:0, gt=Math.max(0,st-yt);
        const mov=(mv&&mv[idx])?mv[idx]:0;
        for(let rep=-3;rep<=3;rep++){
          const t0=offset+cur+rep*cycle-this.state.viewOffsetT;
          const xS=P.left+t0*xF, xG=P.left+(t0+gt)*xF, xE=P.left+(t0+st)*xF;
          if(xE<P.left||xS>P.left+cW) continue;
          if(proceed.includes(mov)){
            ctx.fillStyle=this.cfg.green; this._seg(xS,yP,xG-xS,rH,cW);
            if(yt>0){ctx.fillStyle=this.cfg.yellow;this._seg(xG,yP,xE-xG,rH,cW);}
          } else if(blocked.includes(mov)){
            ctx.fillStyle=this.cfg.blocked;this._seg(xS,yP,xE-xS,rH,cW);
          } else if(mov>=1&&mov<=8){
            ctx.fillStyle=this.cfg.blue;this._seg(xS,yP,xG-xS,rH,cW);
            if(yt>0){ctx.fillStyle='rgba(200,170,0,0.75)';this._seg(xG,yP,xE-xG,rH,cW);}
          } else {
            ctx.fillStyle='rgba(220,30,30,0.35)';this._seg(xS,yP,xE-xS,rH,cW);
          }
          const sw=xE-xS;
          if(sw>14){ctx.save();ctx.fillStyle='rgba(0,0,0,0.65)';ctx.font='bold 8px "JetBrains Mono",monospace';
            ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(mov>=100?'W':mov,xS+sw/2,yP+rH/2);ctx.restore();}
          ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(xE-0.5,yP,1,rH);
        }
        cur+=st;
      });
    };
    ring(tod.splitA,sm.yellowA,sm.movA,false);
    ring(tod.splitB,sm.yellowB,sm.movB,true);
    ctx.strokeStyle='rgba(0,0,0,0.10)';ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(P.left,y);ctx.lineTo(P.left+cW,y);ctx.stroke();ctx.setLineDash([]);
  }

  _drawBand(dir, band, timeHorizon, xF, tToX, distToY, dayIdx, axis, cycle) {
    const ctx = this.ctx, members = this.state.members, distances = this.state.distances, totalDist = this.state.totalDist;
    const isUp = dir === 'up';
    const travelTimes = this.state.travelTimes || new Array(this.state.members.length).fill(0);
    const totalTT = travelTimes[travelTimes.length - 1] || 1;

    if(band.width>0){
      const fill=isUp?'rgba(0,100,220,0.12)':'rgba(0,160,220,0.12)';
      const stroke=isUp?this.cfg.bandUpS:this.cfg.bandDnS;
      for(let rep=-3;rep<=3;rep++){
        const sT=band.start+rep*cycle;
        const fwd=[],bwd=[];
        const idx=isUp?members.map((_,i)=>i):members.map((_,i)=>i).reverse();
        for(const i of idx){
          const tr=isUp ? travelTimes[i] : (totalTT - travelTimes[i]);
          const y=distToY(distances[i]);
          fwd.push({x:tToX(sT+tr),y}); bwd.push({x:tToX(sT+band.width+tr),y});
        }
        ctx.fillStyle=fill;ctx.beginPath();
        fwd.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
        for(let i=bwd.length-1;i>=0;i--)ctx.lineTo(bwd[i].x,bwd[i].y);
        ctx.closePath();ctx.fill();
        ctx.strokeStyle=stroke;ctx.lineWidth=2;
        ctx.beginPath();fwd.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
        ctx.beginPath();bwd.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
      }
    } else {
      const tC=isUp?this.cfg.trajUp:this.cfg.trajDn;
      const pIdx=this.state.todIdx, offsets=this._getOffsets();
      const sIdx=isUp?members.map((_,i)=>i):members.map((_,i)=>i).reverse();
      for(let rep=-1;rep<=2;rep++){
        const baseT = rep*cycle+10;
        ctx.beginPath();ctx.strokeStyle=tC;ctx.lineWidth=1.5;
        
        const firstIdx = sIdx[0];
        const firstTr = isUp ? travelTimes[firstIdx] : (totalTT - travelTimes[firstIdx]);
        ctx.moveTo(tToX(baseT + firstTr), distToY(distances[firstIdx]));

        for (const i of sIdx) {
          const nd=distances[i];
          const tr = isUp ? travelTimes[i] : (totalTT - travelTimes[i]);
          let t = baseT + tr;
          ctx.lineTo(tToX(t),distToY(nd));
          const off=offsets[members[i].id]?offsets[members[i].id][pIdx]:undefined;
          const g=Analyzer.getGreenWindow(members[i],axis,dir,dayIdx,pIdx,cycle,off);
          if(!g) continue;
          const arr=((t%cycle)+cycle)%cycle;
          const gS=g.gStart,gE=(gS+g.gLen)%cycle;
          const isG=(gS<gE)?(arr>=gS&&arr<gE):(arr>=gS||arr<gE);
          if(!isG){
            ctx.stroke();
            let w2=(gS<gE)?((arr<gS)?gS-arr:cycle-arr+gS):((arr>=gE&&arr<gS)?gS-arr:0);
            if(w2<=0)w2=1;
            ctx.beginPath();ctx.strokeStyle=this.cfg.wait;ctx.lineWidth=2;ctx.setLineDash([3,2]);
            ctx.moveTo(tToX(t),distToY(nd));t+=w2;ctx.lineTo(tToX(t),distToY(nd));ctx.stroke();ctx.setLineDash([]);
            ctx.fillStyle=this.cfg.wait;ctx.beginPath();ctx.arc(tToX(t-w2),distToY(nd),3,0,Math.PI*2);ctx.fill();
            ctx.beginPath();ctx.strokeStyle=tC;ctx.lineWidth=1.5;ctx.moveTo(tToX(t),distToY(nd));
          }
        }
        ctx.stroke();
      }
    }
  }

  _seg(x,y,w,h,cW){
    if(w<=0)return;const L=this.cfg.pad.left,R=L+cW;
    const dX=Math.max(L,x),dW=Math.min(R,x+w)-dX;
    if(dW>0)this.ctx.fillRect(dX,y,dW,h);
  }

  _updateInfo(bUp,bDown,cycle){
    const el=document.getElementById(this.infoId); if(!el)return;
    const eUp=Math.round(bUp.width/cycle*100), eDn=Math.round(bDown.width/cycle*100);
    const uL=bUp.width>0?`<b style="color:#0050c8">↑${Math.round(bUp.width)}s(${eUp}%)</b>`:'<span style="color:#c00">비연동</span>';
    const dL=bDown.width>0?`<b style="color:#00a0dc">↓${Math.round(bDown.width)}s(${eDn}%)</b>`:'<span style="color:#c00">비연동</span>';
    el.innerHTML=`${uL} | ${dL}`;
  }
}
</script>
